# PLACEHOLDER for a Matcha-TTS config (Mehta et al., ICASSP 2024,
# https://arxiv.org/abs/2309.03199). src.models.matcha.MatchaTTSPlaceholder is
# currently just embedding, a tiny Transformer encoder, and a naive
# length-matched linear mel projection. It exists purely so `experiment=debug`
# and scripts/synthesize.py|evaluate.py work end-to-end as a smoke test; it is
# not real Matcha-TTS (no Monotonic Alignment Search, no duration predictor,
# no flow-matching decoder). See this repo's README.md ("Implementing
# Matcha-TTS") for the shape of what is missing.
#
# Update `network` below (arch hyperparams: encoder size, duration predictor,
# flow-matching decoder config, ODE solver steps, etc.) while building out the
# real model. src/lightning_module.py (TTSLightningModule) needs no changes.
_target_: src.lightning_module.TTSLightningModule

network:
  _target_: src.models.matcha.MatchaTTSPlaceholder
  # n_symbols is not set here. It is supplied at runtime from the persisted
  # text-frontend vocab (src/data/datamodule.py's TTSDataModule.stats), since
  # it cannot be known until scripts/preprocess.py has run.
  n_mel_channels: ${data.n_mel_channels}
  n_speakers: 1
  multi_speaker: ${data.multi_speaker}
  hidden: 256
  encoder_layers: 2
  encoder_heads: 2
  ffn_dim: 1024
  dropout: 0.1
  inference_length_multiplier: 8.0   # frames/phoneme heuristic used only at inference

# ----- optimization: AdamW (fused) + OneCycleLR -----
optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-3
  betas: [0.9, 0.98]
  eps: 1.0e-9
  weight_decay: 0.01
  fused: true    # requires CUDA; TTSLightningModule.configure_optimizers falls back to false on CPU automatically

# 1cycle policy (Smith, "Super-Convergence"): LR ramps 0 -> max_lr over the first
# pct_start of training, then anneals back down to ~0 by the end. total_steps
# is tied to trainer.max_steps so overriding one CLI flag keeps both in sync.
scheduler:
  _target_: torch.optim.lr_scheduler.OneCycleLR
  max_lr: ${model.optimizer.lr}
  total_steps: ${trainer.max_steps}
  pct_start: 0.1
  anneal_strategy: cos
  div_factor: 25.0
  final_div_factor: 1.0e4
