# PLACEHOLDER for an F5-TTS config (Chen et al., 2024,
# https://arxiv.org/abs/2410.06885). src.models.f5tts.F5TTSPlaceholder is
# currently just embedding + a tiny Transformer encoder + naive
# length-matched linear mel projection -- exists purely so `experiment=debug`
# and scripts/synthesize.py|evaluate.py work end-to-end as a smoke test; it is
# NOT real F5-TTS (no DiT backbone, no flow matching, no reference-audio
# conditioning). See this repo's README.md ("Implementing F5-TTS") for the
# shape of what's missing.
#
# Update `network` below (arch hyperparams: DiT depth/width, flow-matching
# config, ODE solver steps, ...) as you build out the real model --
# src/lightning_module.py (TTSLightningModule) needs no changes.
_target_: src.lightning_module.TTSLightningModule

network:
  _target_: src.models.f5tts.F5TTSPlaceholder
  # n_symbols is NOT set here -- it's supplied at runtime from the persisted
  # text-frontend vocab (src/data/datamodule.py's TTSDataModule.stats), since
  # it can't be known until scripts/preprocess.py has run.
  n_mel_channels: ${data.n_mel_channels}
  n_speakers: 1
  multi_speaker: ${data.multi_speaker}
  hidden: 256
  encoder_layers: 2
  encoder_heads: 2
  ffn_dim: 1024
  dropout: 0.1
  inference_length_multiplier: 8.0   # frames/phoneme heuristic used only at inference

# ----- optimization: AdamW (fused) + OneCycleLR -----
optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-3
  betas: [0.9, 0.98]
  eps: 1.0e-9
  weight_decay: 0.01
  fused: true    # requires CUDA; TTSLightningModule.configure_optimizers falls back to false on CPU automatically

# 1cycle policy (Smith, "Super-Convergence"): LR ramps 0 -> max_lr over the first
# pct_start of training, then anneals back down to ~0 by the end -- total_steps
# is tied to trainer.max_steps so overriding one CLI flag keeps both in sync.
scheduler:
  _target_: torch.optim.lr_scheduler.OneCycleLR
  max_lr: ${model.optimizer.lr}
  total_steps: ${trainer.max_steps}
  pct_start: 0.1
  anneal_strategy: cos
  div_factor: 25.0
  final_div_factor: 1.0e4
