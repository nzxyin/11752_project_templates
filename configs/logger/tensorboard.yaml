# Selected via `logger=tensorboard` (default). Each entry under this key is
# instantiated and passed to `Trainer(logger=[...])`. See configs/logger/both.yaml
# for running TensorBoard and W&B at the same time.
tensorboard:
  _target_: pytorch_lightning.loggers.TensorBoardLogger
  save_dir: ${paths.log_dir}/tensorboard
  name: ${name}
  version: null
  default_hp_metric: false
