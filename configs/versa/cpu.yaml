# VERSA's own CPU-only example metric config (egs/speech_cpu.yaml upstream) --
# no large pretrained metric models needed, safe to run on a laptop. Used by
# default by scripts/evaluate.py (--versa_config); point at a heavier VERSA
# config (e.g. its egs/speech.yaml, which adds UTMOS/DNSMOS/speaker-similarity/etc.)
# for a more thorough but much slower/heavier evaluation.

# mcd f0 related metrics
#  -- mcd: mel cepstral distortion
#  -- f0_corr: f0 correlation
#  -- f0_rmse: f0 root mean square error
- name: mcd_f0
  f0min: 40
  f0max: 800
  mcep_shift: 5
  mcep_fftl: 1024
  mcep_dim: 39
  mcep_alpha: 0.466
  seq_mismatch_tolerance: 0.1
  power_threshold: -20
  dtw: false

# signal related metrics
# -- sir: signal to interference ratio
# -- sar: signal to artifact ratio
# -- sdr: signal to distortion ratio
# -- ci-sdr: scale-invariant signal to distortion ratio
# -- si-snri: scale-invariant signal to noise ratio improvement
- name: signal_metric

# pesq related metrics
# -- pesq: perceptual evaluation of speech quality
- name: pesq

# stoi related metrics
# -- stoi: short-time objective intelligibility
- name: stoi
